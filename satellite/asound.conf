# /etc/asound.conf da Pi do satélite (friday-satellite). Mestre: /homeassistant/tools/satelite/asound.conf
#
# Por que existe (04/10/2026): o Jabra Speak 410 aceita saída a 8, 16 ou 48 kHz, mas a 16 kHz ele toca
# 3x mais rápido (3 s de áudio saem em 1,03 s; voz de esquilo). A 48 kHz o tempo é correto. O microfone
# só grava a 16 kHz, e grava certo. Então a saída é sempre convertida para 48 kHz, e a entrada fica em 16 kHz.
#
# Desde 21/10/2026 (spec 2026-10-21-satellite-media): o Jabra só aceita um áudio por vez, então o ÚNICO dono
# dele é o dmix "mixer_out" (48 kHz estéreo). Duas entradas:
#   voice  = o aplay do programa do satélite (sons, voz dela, alertas)
#   music  = softvol "Music" (controle de mixer no card USB, 0-100%; o programa o abaixa no ducking)
#            e é o "default" de saída: player Sendspin, shairport e qualquer outro programa caem aqui.
# ipc_perm 0666 porque programa (jose), player Sendspin e shairport rodam com usuários diferentes.
# O volume único (R5) segue sendo o PCM de hardware do Jabra: os dois caminhos passam por ele.

pcm.mixer_out {
    type dmix
    ipc_key 48201021
    ipc_perm 0666
    slave {
        pcm "hw:CARD=USB,DEV=0"
        rate 48000
        channels 2
        period_size 1024
        # 341 ms. Com 4096 (85 ms) o dmix limitava o buffer de quem toca: o Sendspin (pede 200 ms) perdia a
        # sincronia a cada ~7 s, com corte audível, e o aplay da voz (pede 400 ms) ficava com 85 ms (21/10).
        buffer_size 16384
    }
}

pcm.voice {
    type plug
    slave.pcm "mixer_out"
}

pcm.music_vol {
    type softvol
    slave.pcm "mixer_out"
    control {
        name "Music"
        card USB
    }
    min_dB -40.0
    max_dB 0.0
    resolution 101
}

pcm.music {
    type plug
    slave.pcm "music_vol"
}

pcm.jabra_entrada {
    type plug
    slave {
        pcm "hw:CARD=USB,DEV=0"
        rate 16000
        channels 1
    }
}

pcm.!default {
    type asym
    playback.pcm "music"
    capture.pcm "jabra_entrada"
}

ctl.!default {
    type hw
    card USB
}
