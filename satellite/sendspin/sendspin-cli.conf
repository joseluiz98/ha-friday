# Player Sendspin do satélite (spec 2026-10-21-satellite-media §6.3). Toca no default do ALSA = PCM music (dmix + softvol Music).
name = Escritório
buffer-ms = 200
# 21/10: direto no softvol Music (só 48 kHz/16 bits, o formato do dmix). Pelo default (plug, convertendo 44,1->48 kHz) o
# Sendspin perdia a sincronia a cada ~7 s (corte audível); assim o Music Assistant manda 48 kHz e o ducking continua.
output = music_vol
