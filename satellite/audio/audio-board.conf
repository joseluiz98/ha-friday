# Sendspin player only with a supported audio board (the Voice Program switch does not stop the music) (spec 2026-11-17-xvf3800-support). Replaces the provisional
# jabra-only.conf of 15/11. The check also keeps /etc/asound.conf pointed at the board found.
[Service]
ExecCondition=+/usr/local/sbin/friday-audio-select --check-board
