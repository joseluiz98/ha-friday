# /etc/asound.conf do satélite com o ReSpeaker XVF3800 (card ALSA "Array"; apontado por friday-audio-select).
# Mestre: satellite/audio/xvf3800.conf. Medido na bancada em 17/11/2026 (palavra "Friday" 14/14 a 2 m com música alta).
#
# O que a placa impõe: firmware USB v2.1.1 só fala 48 kHz com 2 canais, nos dois sentidos. Os nomes dos PCMs são os
# mesmos do Jabra (voice, music, music_vol, jabra_entrada) para o programa, o Sendspin e o shairport não saberem
# qual placa está ligada.
#
# Conversor de taxa: o speexrate (libasound2-plugins) é o que a Pi 3 aguenta sem pesar na CPU e sem artefato audível.
defaults.pcm.rate_converter "speexrate_medium"

# Único dono da saída da placa (dmix 48 kHz estéreo), como no Jabra: voz do programa e música entram aqui.
# ipc_perm 0666 porque programa (jose), player Sendspin e shairport rodam com usuários diferentes.
pcm.mixer_out {
    type dmix
    ipc_key 48201021
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Array,DEV=0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 16384
    }
}

# Ajuste fino do volume da casa (spec 2026-11-27): voz e música passam por aqui. A placa fica no próprio nível e o
# `Fine` atenua a fração (0..120 = -6..0 dB). O programa grava; o ducking continua só no `Music`.
pcm.fine_vol {
    type softvol
    slave.pcm "mixer_out"
    control {
        name "Fine"
        card Array
    }
    min_dB -6.0
    max_dB 0.0
    resolution 121
}

# Saída em mono: a referência do cancelamento de eco do chip é UM canal (o esquerdo). Misturamos os dois canais
# da fonte (0.5 cada) e mandamos o mesmo sinal aos dois, para a referência ter o que a caixa realmente toca.
pcm.mono_out {
    type route
    slave.pcm "fine_vol"
    slave.channels 2
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}

# voice = o aplay do programa (sons, voz dela, alertas).
pcm.voice {
    type plug
    slave.pcm "mono_out"
}

# music = softvol "Music" no card da placa (0-100%; o programa o abaixa no ducking) e é o "default" de saída.
pcm.music_vol {
    type softvol
    slave.pcm "mono_out"
    control {
        name "Music"
        card Array
    }
    min_dB -40.0
    max_dB 0.0
    resolution 101
}

pcm.music {
    type plug
    slave.pcm "music_vol"
}

# Captura compartilhada (dsnoop): o programa e quem mais precisar leem o mesmo fluxo sem disputar a placa.
pcm.xvf_in {
    type dsnoop
    ipc_key 48201117
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Array,DEV=0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# Entrada do programa: canal 1 do chip = canal de reconhecimento (linear, sem AGC nem supressão de ruído),
# a 16 kHz mono. O nome "jabra_entrada" é o contrato com o programa; aqui ele aponta para o XVF.
pcm.jabra_entrada {
    type plug
    slave {
        pcm "xvf_in"
        rate 48000
        channels 2
    }
    ttable.0.1 1
}

# 18/11 (dono, opção b): os DOIS canais do chip a 16 kHz numa leitura só, para o programa (CapturaDupla). Canal 0 =
# conferência (AEC + supressão do eco residual + AGC), vai ao Gemini na conversa; canal 1 = reconhecimento (linear),
# palavra, VAD e gravações. Mesma fonte (xvf_in) e mesmo conversor do jabra_entrada.
pcm.xvf_dois {
    type plug
    slave {
        pcm "xvf_in"
        rate 48000
        channels 2
    }
}

pcm.!default {
    type asym
    playback.pcm "music"
    capture.pcm "jabra_entrada"
}

ctl.!default {
    type hw
    card Array
}
