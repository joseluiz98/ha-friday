set_wifi:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: friday
    ssid:
      required: true
      selector:
        text:
    password:
      required: true
      selector:
        text:
          type: password
retry_provisioning:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: friday
set_setting:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: friday
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        object:
build_image:
  fields:
    version:
      required: false
      example: "0.3.8"
      selector:
        text:
announce:
  fields:
    message:
      required: true
      example: "Dinner is ready"
      selector:
        text:
          multiline: true
    device_id:
      required: false
      selector:
        device:
          multiple: true
          integration: friday
